name: Bug report
description: Report a reproducible devloop bug
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact devloop command, spec shape, and relevant output.
      placeholder: |
        devloop --plain .specs/change.md
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: devloop version
      placeholder: "Git commit or release tag"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bash version, git version, and configured coder/reviewer agents.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste only logs that are safe to share. `.codex/` artifacts can contain prompts and local paths.
