name: Feature request
description: Propose a focused devloop improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should devloop do differently?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete checks that would prove the feature works.
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: What should stay out of scope?
